<!DOCTYPE html>
<html>
<head>
  <title>Il mio primo sito</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem 3rem;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 500px;
    }

    h1 {
      margin: 0 0 1rem;
      color: #4c1d95;
      font-size: 2.5rem;
    }

    p {
      margin: 0;
      color: #444;
      font-size: 1.1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ciao mondo!</h1>
    <p>Questa è la mia prima pagina HTML, scritta da me.</p>
  </div>
</body>
</html>
